<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crie seu cadastro!</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <section id="card-cad">
        <h1>Faça seu cadastro</h1>
        <form action="perfil.html">
            <label for="nome">Nome completo</label>
            <input type="text" required>
            <label for="data-nsc">Data de Nascimento</label>
            <input type="date"><br>
            <label for="email">E-mail</label>
            <input type="text" placeholder="email@exemplo.com" required>
            <span>Senha</span>
            <input type="password" placeholder="Digite sua senha" required>
            <input type="password" placeholder="Repita a senha" required>
            <input type="submit" value="submit">
        </form>
    </section>
    

    
</body>
</html>
