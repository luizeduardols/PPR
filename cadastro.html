<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crie seu cadastro!</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>
    <main class="prin-cad">
        <section id="card-cad">
            <h1>Faça seu cadastro</h1>
            <form id="form-cadastro" action="perfil.html">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" required>
                <label for="data-nsc">Data de Nascimento</label>
                <input type="date" id="data-nsc"><br>
                <label for="email">E-mail</label>
                <input type="text" id="email" placeholder="email@exemplo.com" required>
                <span>Senha</span>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
                <input type="password" id="senha-confirma" placeholder="Repita a senha" required>
                <span id="erro-cadastro" style="color:red;display:none;"></span>
                <input type="submit" value="Cadastrar">
            </form>
        </section>
    </main>
    <footer></footer>
    <script src="js/cadastro.js"></script>
</body>

</html>
